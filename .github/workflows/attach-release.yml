name: Attach v1.7.2 release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        default: 'v1.7.2'
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release upload "${{ inputs.tag }}" SoterCloak_v1.7.2.zip SoterCloak_v1.7.2_source.zip --repo gongkuan2023-commits/SoterCloak --clobber
